const KEY=DATA.storageKey;
const $=s=>document.querySelector(s);
const L=['أ','ب','ج','د','هـ'];
const store={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
let S=null,tick=null;
const show=id=>['login','exam','result'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function save(){store.s(KEY+'_state',S)}
$('#info').textContent=DATA.questions.length+' سؤال اختيار من متعدد';
if(store.g('dark')){document.body.classList.add('dark')}
$('#dm').onclick=()=>{document.body.classList.toggle('dark');store.s('dark',document.body.classList.contains('dark'))};
const prev=store.g(KEY+'_state');
if(prev&&!prev.done){$('#resume').classList.remove('hide');$('#nm').value=prev.name||''}
else if(prev){$('#nm').value=prev.name||'';$('#cl').value=prev.cls||''}
function begin(idx,fresh){
  const qs=idx||DATA.questions.map((_,i)=>i);
  S={name:$('#nm').value.trim(),cls:$('#cl').value.trim(),order:qs,ans:{},flags:{},cur:0,left:qs.length*60,done:false};
  save();run();
}
$('#start').onclick=()=>{ if(!$('#nm').value.trim()){alert('من فضلك اكتب اسمك أولًا');return} begin()};
$('#resume').onclick=()=>{S=store.g(KEY+'_state');run()};
function run(){show('exam');$('#timer').classList.remove('hide');clearInterval(tick);
  tick=setInterval(()=>{S.left--;paintT();if(S.left%5==0)save();if(S.left<=0)finish()},1000);paintT();draw()}
function paintT(){const t=$('#timer');t.textContent='⏱ '+mmss(Math.max(0,S.left));t.classList.toggle('low',S.left<=60)}
function draw(){
  const n=S.order.length,i=S.cur,q=DATA.questions[S.order[i]];
  $('#pos').textContent='السؤال '+(i+1)+' من '+n;
  const a=Object.keys(S.ans).length;$('#ans').textContent='تمت الإجابة: '+a+'/'+n;
  $('#pb').style.width=(a/n*100)+'%';
  let h='<div class="q">'+esc(q.text)+'</div>';
  (q.images||[]).forEach(s=>h+='<img src="'+s+'" alt="">');
  q.choices.forEach((c,k)=>h+='<div class="ch'+(S.ans[i]===k?' sel':'')+'" data-k="'+k+'"><b>'+L[k]+'</b><span>'+esc(c)+'</span></div>');
  $('#qbox').innerHTML=h;
  document.querySelectorAll('#qbox .ch').forEach(e=>e.onclick=()=>{S.ans[i]=+e.dataset.k;save();draw()});
  $('#prev').disabled=i==0;$('#next').disabled=i==n-1;
  $('#flag').textContent=S.flags[i]?'🚩 إلغاء التعليم':'🚩 علّم للمراجعة';
  $('#map').innerHTML=S.order.map((_,k)=>'<button data-k="'+k+'" class="'+(S.ans[k]!=null?'done ':'')+(S.flags[k]?'flag ':'')+(k==i?'cur':'')+'">'+(k+1)+'</button>').join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;save();draw();scrollTo(0,0)});
}
$('#prev').onclick=()=>{S.cur--;save();draw()};
$('#next').onclick=()=>{S.cur++;save();draw()};
$('#flag').onclick=()=>{S.flags[S.cur]=!S.flags[S.cur];save();draw()};
$('#fin').onclick=()=>{const un=S.order.length-Object.keys(S.ans).length;
  if(confirm(un?'باقي '+un+' سؤال بدون إجابة. هل تريد التسليم؟':'هل أنت متأكد من تسليم الاختبار؟'))finish()};
function finish(){clearInterval(tick);S.done=true;S.finishedAt=new Date().toISOString();save();$('#timer').classList.add('hide');results()}
function results(){
  show('result');const n=S.order.length;let ok=0,bad=0,sk=0,wr=[];
  let rv='',rm='';
  S.order.forEach((qi,i)=>{const q=DATA.questions[qi],a=S.ans[i],good=a===q.correctIndex;
    if(a==null){sk++;wr.push(qi)}else if(good)ok++;else{bad++;wr.push(qi)}
    const st=a==null?'sk':good?'ok':'bad';
    rm+='<button class="'+(a==null?'':good?'ok':'bad')+'" onclick="document.getElementById(\'r'+i+'\').scrollIntoView({behavior:\'smooth\'})">'+(i+1)+'</button>';
    let h='<div class="card rv" id="r'+i+'"><h4>'+(i+1)+'. '+esc(q.text)+' <span class="tag '+st+'">'+(a==null?'لم تُجب':good?'صحيحة':'خاطئة')+'</span></h4>';
    (q.images||[]).forEach(s=>h+='<img src="'+s+'" alt="">');
    q.choices.forEach((c,k)=>h+='<div class="ch '+(k===q.correctIndex?'ok':k===a?'bad':'')+'"><b>'+L[k]+'</b><span>'+esc(c)+(k===q.correctIndex?' ✔':k===a?' ✘':'')+'</span></div>');
    rv+=h+'</div>'});
  const pct=Math.round(ok/n*100);
  $('#who').textContent=(S.name||'')+(S.cls?' — '+S.cls:'');
  $('#pct').textContent=pct+'%';
  $('#stats').innerHTML='<span>✔ صحيحة: '+ok+'</span><span>✘ خاطئة: '+bad+'</span><span>— بدون إجابة: '+sk+'</span><span>الدرجة: '+ok+'/'+n+'</span><span>الزمن: '+mmss(n*60-Math.max(0,S.left))+'</span>';
  $('#rmap').innerHTML=rm;$('#review').innerHTML=rv;
  $('#wrong').disabled=!wr.length;$('#wrong').onclick=()=>{begin(wr)};
  S._ok=ok;scrollTo(0,0);
}
$('#retry').onclick=()=>{begin()};
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
$('#exp').onclick=()=>dl('model-quiz_'+KEY.replace(/^quiz_/,'')+'.json',JSON.stringify({...DATA,exportedAt:new Date().toISOString()}),'application/json');
$('#rep').onclick=()=>{const n=S.order.length;
  let t='الاختبار: U3L1_P1 MCQ B\nالاسم: '+S.name+'\nالصف: '+S.cls+'\nالدرجة: '+S._ok+'/'+n+' ('+Math.round(S._ok/n*100)+'%)\n\n';
  S.order.forEach((qi,i)=>{const q=DATA.questions[qi],a=S.ans[i];t+=(i+1)+') '+(a==null?'لم تُجب':a===q.correctIndex?'صحيحة':'خاطئة')+' — '+q.text+'\n   إجابتك: '+(a==null?'-':q.choices[a])+'\n   الصحيحة: '+q.choices[q.correctIndex]+'\n'});
  dl('نتيجة_U3L1_P1_MCQ_B.txt',t,'text/plain;charset=utf-8')};
</script>

  }
  function go(v,h){
    try{localStorage.setItem(HK,h)}catch(e){}
    try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})}); }catch(e){}
    try{ if(window.caches) caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})}); }catch(e){}
    setTimeout(function(){location.replace(location.pathname+'?v='+encodeURIComponent(v))},150);
  }
  function hash(t){var x=5381,i=t.length;while(i)x=(x*33)^t.charCodeAt(--i);return String(x>>>0)}
  function check(auto){
    try{
      fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
        var m=t.match(/<meta name="app-version" content="([^"]+)"/),h=hash(t),old=null;
        try{old=localStorage.getItem(HK)}catch(e){}
        var changed=(m&&m[1]!==cur)||(old&&old!==h);
        if(!changed){ if(!old){try{localStorage.setItem(HK,h)}catch(e){}} return; }
        var tag=(m?m[1]:'x')+'-'+h, v=h;
        if(auto&&sessionStorage.getItem('najm_upd_done')!==tag){sessionStorage.setItem('najm_upd_done',tag);go(v,h);}
        else if(sessionStorage.getItem('najm_upd_done')!==tag||!auto) banner(v,h);
      }).catch(function(){});
    }catch(e){}
  }
  check(true);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
})();
</script>
