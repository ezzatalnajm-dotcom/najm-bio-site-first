<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-10-21-a">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>لوحة تقدمي — أ. عزت نجم الأحياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1a3b;--navy2:#13285a;--gold:#f5c542;--gold2:#d9a521;--tx:#fff;--mut:#aeb9d6}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(160deg,var(--navy),#060f26);color:var(--tx);min-height:100vh;padding:16px}
.wrap{max-width:640px;margin:0 auto}
.brand{text-align:center;color:var(--gold);font-weight:900;font-size:20px;margin:6px 0 16px}
.card{background:var(--navy2);border:1px solid rgba(245,197,66,.3);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 6px}
.row{display:flex;gap:8px;direction:ltr}
input{font-family:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#fff;direction:ltr;text-align:center}
.cc{width:84px;font-weight:800}.num{flex:1;min-width:0}
button{font-family:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%;margin-top:14px;background:linear-gradient(150deg,var(--gold),var(--gold2));color:var(--navy)}
button.sec{background:transparent;color:var(--mut);border:1px solid rgba(255,255,255,.2);font-size:14px;padding:10px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}.err{color:#ff8a8a;font-weight:700;margin-top:10px;display:none}
.hide{display:none}
.big{text-align:center}.big .p{font-size:54px;font-weight:900;color:var(--gold);line-height:1.1}
.big .g{font-size:24px;font-weight:900;margin:4px 0}.big .t{color:var(--gold);font-weight:700;font-size:14px}
.big .s{color:var(--mut);font-size:13px;margin-top:6px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ex:last-child{border:0}.ex .n{flex:1;font-weight:700;font-size:14px}.ex .d{font-size:11px;color:var(--mut);font-weight:400}
.ex .pc{font-weight:900;color:var(--gold);min-width:56px;text-align:left;direction:ltr}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.rv{margin-top:8px}.rv summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:12px}.rv .w{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:12px;line-height:1.7;font-weight:400}.rv .a{color:#ff9d9d}.rv .c{color:#8ee6a8}.rv .ok{font-size:12px;color:#8ee6a8;margin-top:6px}
.wa{background:linear-gradient(150deg,#25d366,#128c4a);color:#fff}
.prog{margin:14px auto 4px;padding:12px 14px;border:2px solid var(--gold);border-radius:16px;background:rgba(245,197,66,.12)}
.prog .pt{font-weight:900;font-size:20px;line-height:1.6}
.prog .pt b{color:var(--gold);font-size:32px;margin:0 4px;vertical-align:middle}
.prog .pb{height:10px;border-radius:6px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.tl{display:block;text-align:center;margin-top:14px;font-size:11px;color:var(--mut);opacity:.55;cursor:pointer;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;width:auto;margin:0;cursor:pointer}
.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.band{border-radius:14px;margin-top:12px;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.band .bh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-weight:900;font-size:15px}
.band .bh span{background:rgba(0,0,0,.25);border-radius:12px;padding:1px 10px;font-size:13px}
.band .st{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:600}
.band .st i{font-style:normal;font-weight:900;direction:ltr;color:var(--gold)}
.band .st small{color:var(--mut);font-weight:400;font-size:11px;display:block}
.b-ex .bh{background:rgba(245,197,66,.25);color:var(--gold)}
.b-vg .bh{background:rgba(70,200,120,.22);color:#8ee6a8}
.b-g .bh{background:rgba(90,150,255,.22);color:#9cc2ff}
.b-ac .bh{background:rgba(255,160,60,.22);color:#ffc27a}
.b-lo .bh{background:rgba(255,90,90,.2);color:#ff9d9d}
.b-no .bh{background:rgba(255,255,255,.1);color:var(--mut)}
.sumline{font-size:13px;color:var(--mut);margin:8px 0 2px}
.upd{position:fixed;bottom:12px;left:12px;right:12px;background:var(--gold);color:var(--navy);font-weight:800;text-align:center;padding:10px;border-radius:12px;z-index:9;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">⭐ أ. عزت نجم الأحياء — لوحة تقدمي</div>

  <div class="card" id="login">
    <label>هاتف الطالب</label>
    <div class="row"><input class="cc" id="c1" value="974" inputmode="numeric" maxlength="4" oninput="this.value=en(this.value).replace(/\D/g,'')"><input class="num" id="p1" type="tel" inputmode="numeric" placeholder="50123456"></div>
    <label>هاتف ولي الأمر</label>
    <div class="row"><input class="cc" id="c2" value="974" inputmode="numeric" maxlength="4" oninput="this.value=en(this.value).replace(/\D/g,'')"><input class="num" id="p2" type="tel" inputmode="numeric" placeholder="50123456"></div>
    <div class="hint">اكتب الرقم مباشرة (المفتاح 974 مضاف تلقائيًا)، وغيّره فقط للأرقام الدولية.</div>
    <button onclick="go()">عرض نتائجي</button>
    <div class="err" id="err"></div>
    <a class="tl" onclick="tShow()">دخول المعلم</a>
  </div>

  <div class="card hide" id="tlogin">
    <label>رمز المعلم</label>
    <input id="tkey" type="password" style="width:100%" placeholder="••••••">
    <button onclick="tGo()">عرض المجموعات</button>
    <button class="sec" onclick="tBack()">رجوع</button>
    <div class="err" id="terr"></div>
  </div>

  <div id="tview" class="hide">
    <div class="card">
      <div style="font-weight:900;color:var(--gold)">👨‍🏫 المجموعات حسب التقدير</div>
      <div class="chips" id="tchips"></div>
      <div class="sumline" id="tsum"></div>
      <div id="tbands"></div>
    </div>
    <button class="sec" onclick="tGo(true)">🔄 تحديث البيانات</button>
    <button class="sec" onclick="tOut()">خروج المعلم</button>
  </div>

  <div id="dash" class="hide">
    <div class="card big">
      <div id="nm" style="font-weight:800;margin-bottom:6px"></div>
      <div class="p" id="pc"></div><div class="g" id="gr"></div><div class="t" id="tp"></div><div class="prog" id="prog"></div><div class="s" id="tk"></div>
    </div>
    <div class="card"><div style="font-weight:900;color:var(--gold);margin-bottom:4px">📊 أعلى نتيجة في كل اختبار</div><div id="list"></div></div>
    <button class="wa" onclick="share()">📲 شارك النتيجة مع ولي الأمر</button>
    <button class="sec" onclick="out()">تسجيل خروج</button>
  </div>
</div>
<div class="upd" id="upd">⏳ جاري تحديث الصفحة لآخر نسخة...</div>

<script>
const URL_="https://script.google.com/macros/s/AKfycbzpVJBVOa_ewqV4K0hyeiTaeIZFbXGZLvYoD4at-9FLim98C-YHw18XZa_M_PSIeM9_kA/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function review(e){
  if(!Array.isArray(e.wrong)) return '';
  if(!e.wrong.length) return '<div class="ok">🌟 أجبت كل الأسئلة بشكل صحيح</div>';
  return '<details class="rv"><summary>📝 راجع أخطائي ('+e.wrong.length+')</summary>'+e.wrong.map(w=>'<div class="w">'+esc(w.q)+'<br><span class="a">إجابتك: '+(w.a?esc(w.a):'لم تُجب')+'</span><br><span class="c">الصحيحة: '+esc(w.c)+'</span></div>').join('')+'</details>';
}
const en=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
let U=null,D=null;
const exW=n=>(n>=2&&n<=10)?'اختبارات':'اختبارًا';
function examsLine(){ // "أنجز X اختبارًا من أصل Y" (Y = الاختبارات الظاهرة للمشتركين حاليًا)
  const taken=+D.taken||0, tot=+D.totalExams||0;
  if(tot<=0) return {text:'أنجز '+taken+' '+exW(taken),pct:null};
  const total=Math.max(tot,taken);
  return {text:'أنجز '+taken+' '+exW(taken)+' من أصل '+total,taken:taken,total:total,pct:Math.round(taken/total*100)};
}
function progBox(){
  const l=examsLine();
  $('prog').innerHTML='<div class="pt">🎯 '+(l.pct==null?'أنجز <b>'+(+D.taken||0)+'</b> '+exW(+D.taken||0):'أنجز <b>'+l.taken+'</b> '+exW(l.taken)+' من أصل <b>'+l.total+'</b>')+'</div>'+(l.pct==null?'':'<div class="pb"><i style="width:'+l.pct+'%"></i></div>');
}

function full(code,num){
  code=en(code).replace(/\D/g,'').replace(/^0+/,'')||'974';
  let r=en(num).replace(/[\s\-().]/g,'');
  if(r[0]==='+'||r.startsWith('00')) return r.replace(/\D/g,'').replace(/^00/,'');
  r=r.replace(/\D/g,'');
  return (code==='974'&&/^974\d{8}$/.test(r))?r:code+r;
}
function ok(p){return p.startsWith('974')?/^974\d{8}$/.test(p):/^\d{8,15}$/.test(p)}
function grade(p){return p>=85?'ممتاز':p>=75?'جيد جدًا':p>=60?'جيد':p>=45?'مقبول':'يحتاج إلى دعم'}
function showErr(m){const e=$('err');e.textContent=m;e.style.display='block'}

async function go(){
  const phone=full($('c1').value,$('p1').value),parent=full($('c2').value,$('p2').value);
  if(!ok(phone)||!ok(parent)) return showErr('❌ تأكد من الرقمين (رقم قطري من 8 أرقام)');
  $('err').style.display='none';
  const b=document.querySelector('#login button');b.textContent='⏳ جاري التحميل...';
  try{
    const r=await fetch(URL_+'?action=progress&phone='+phone+'&parent='+parent+'&t='+Date.now());
    const d=await r.json();
    if(!d.ok) throw new Error(d.error==='pending'?'pd':d.error==='not found'?'nf':'x');
    U={phone,parent};D=d;
    try{localStorage.setItem('najm_progress_user',JSON.stringify(U))}catch(e){}
    render();
  }catch(e){showErr(e.message==='pd'?'⏳ طلبك قيد المراجعة وسيتم تفعيله قريبًا.':e.message==='nf'?'❌ الرقمان غير مسجلين. تواصل مع الأستاذ.':'❌ تعذر الاتصال، حاول مرة أخرى.')}
  b.textContent='عرض نتائجي';
}

function render(){
  $('login').classList.add('hide');$('dash').classList.remove('hide');
  $('nm').textContent='👤 '+(D.name||'طالب');
  if(D.overall==null){
    $('pc').textContent='—';$('gr').textContent='لا توجد نتائج بعد';$('tp').textContent='';$('tk').textContent='ابدأ بحل أحد بنوك الأسئلة وستظهر نتيجتك هنا';progBox();
    $('list').innerHTML='<div class="hint">لم تسجل أي نتيجة حتى الآن.</div>';return;
  }
  $('pc').textContent=D.overall.toFixed(1)+'%';
  $('gr').textContent=grade(D.overall);
  $('tp').textContent=(D.n>=20&&D.topPct<=20)?'🏅 ضمن أفضل '+D.topPct+'% من الطلاب':'';
  progBox();$('tk').textContent='التقدير العام = مجموع الدرجات ÷ مجموع الدرجات الكلية';
  $('list').innerHTML=D.exams.map(e=>{
    const dt=e.at?new Date(e.at).toLocaleDateString('ar-EG'):'';
    return `<div class="ex"><div class="n">${esc(e.title)}<div class="d">${dt} · ${e.score}/${e.total} · ${e.attempts} محاولة</div><div class="bar"><i style="width:${Math.min(100,e.percent)}%"></i></div>${review(e)}</div><div class="pc">${e.percent.toFixed(1)}%</div></div>`;
  }).join('');
}

function share(){
  let t=`*نتيجة ${D.name||'الطالب'} في بنوك الأسئلة — أ. عزت نجم الأحياء*\nالتقدير العام: ${D.overall==null?'—':grade(D.overall)+' ('+D.overall.toFixed(1)+'%)'}\nالاختبارات المنجزة: ${(()=>{const l=examsLine();return l.pct==null?(+D.taken||0):l.taken+' من أصل '+l.total})()}\n`;
  D.exams.forEach(e=>t+=`• ${e.title}: ${e.percent.toFixed(1)}%\n`);
  window.open('https://wa.me/'+U.parent+'?text='+encodeURIComponent(t),'_blank');
}
function out(){try{localStorage.removeItem('najm_progress_user')}catch(e){}U=D=null;$('dash').classList.add('hide');$('login').classList.remove('hide')}

/* ===== شاشة المعلم: المجموعات حسب التقدير ===== */
let TD=null,TG='';
const BANDS=[['b-ex','ممتاز',p=>p>=85],['b-vg','جيد جدًا',p=>p>=75&&p<85],['b-g','جيد',p=>p>=60&&p<75],['b-ac','مقبول',p=>p>=45&&p<60],['b-lo','يحتاج إلى دعم',p=>p<45]];
function tShow(){$('login').classList.add('hide');$('tlogin').classList.remove('hide');$('tkey').value=sessionStorage.getItem('najm_tkey')||''}
function tBack(){$('tlogin').classList.add('hide');$('login').classList.remove('hide')}
function tOut(){try{sessionStorage.removeItem('najm_tkey')}catch(e){}TD=null;$('tview').classList.add('hide');$('login').classList.remove('hide')}
async function tGo(again){
  const k=again?(sessionStorage.getItem('najm_tkey')||''):$('tkey').value.trim();
  const e=$('terr');e.style.display='none';
  if(!k){e.textContent='❌ اكتب الرمز';e.style.display='block';return}
  try{
    const r=await fetch(URL_+'?action=groups&key='+encodeURIComponent(k)+'&t='+Date.now());
    const d=await r.json();
    if(!d.ok||!Array.isArray(d.students)) throw new Error(d.error==='unauthorized'?'ua':'x');
    try{sessionStorage.setItem('najm_tkey',k)}catch(_){}
    TD=d.students;
    if(!TG||!TD.some(s=>(s.group||'بدون مجموعة')===TG)) TG='';
    $('tlogin').classList.add('hide');$('login').classList.add('hide');$('tview').classList.remove('hide');tRender();
  }catch(x){
    const m=x.message==='ua'?'❌ الرمز غير صحيح':'❌ تعذر جلب البيانات (تأكد أن الخادم محدَّث لدعم المجموعات)';
    if(again){alert(m)}else{e.textContent=m;e.style.display='block'}
  }
}
function tRender(){
  const gs={};TD.forEach(s=>{const g=s.group||'بدون مجموعة';(gs[g]=gs[g]||[]).push(s)});
  const names=Object.keys(gs).sort((a,b)=>a.localeCompare(b,'ar'));
  if(TG!==''&&!gs[TG]) TG='';
  $('tchips').innerHTML='<button class="chip'+(TG===''?' on':'')+'" onclick="tPick(\'\')">الكل ('+TD.length+')</button>'+names.map(n=>'<button class="chip'+(TG===n?' on':'')+'" data-g="'+esc(n)+'" onclick="tPick(this.dataset.g)">'+esc(n)+' ('+gs[n].length+')</button>').join('');
  const list=TG===''?TD:gs[TG];
  const has=list.filter(s=>s.overall!=null),no=list.filter(s=>s.overall==null);
  $('tsum').textContent=BANDS.map(b=>b[1]+': '+has.filter(s=>b[2](+s.overall)).length).join(' · ')+(no.length?' · بدون نتائج: '+no.length:'');
  const row=s=>'<div class="st"><div>'+esc(s.name||'—')+(TG===''&&s.group?'<small>'+esc(s.group)+'</small>':'')+'</div><i>'+(s.overall==null?'—':(+s.overall).toFixed(1)+'%')+'</i></div>';
  let h='';
  BANDS.forEach(b=>{const L=has.filter(s=>b[2](+s.overall)).sort((x,y)=>y.overall-x.overall);
    h+='<div class="band '+b[0]+'"><div class="bh">'+b[1]+'<span>'+L.length+'</span></div>'+(L.length?L.map(row).join(''):'<div class="st" style="color:var(--mut)">لا يوجد</div>')+'</div>'});
  if(no.length) h+='<div class="band b-no"><div class="bh">لم يبدؤوا بعد<span>'+no.length+'</span></div>'+no.map(row).join('')+'</div>';
  $('tbands').innerHTML=h;
}
function tPick(g){TG=g;tRender()}

/* ===== تحديث تلقائي: يمنع ظهور النسخة القديمة للطلاب ===== */
const APP_V=(document.querySelector('meta[name=app-version]')||{}).content||'';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/<meta name="app-version" content="([^"]+)"/);
    if(!m||m[1]===APP_V) return;
    if(sessionStorage.getItem('najm_sp_reloaded')===m[1]) return; // منع التكرار
    sessionStorage.setItem('najm_sp_reloaded',m[1]);
    $('upd').style.display='block';
    if('serviceWorker' in navigator){(await navigator.serviceWorker.getRegistrations()).forEach(x=>x.unregister())}
    if(window.caches){(await caches.keys()).forEach(k=>caches.delete(k))}
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

(function(){try{const s=JSON.parse(localStorage.getItem('najm_progress_user')||localStorage.getItem('najm_shared_user')||'null');
  if(s&&s.phone&&s.parent){$('p1').value='+'+s.phone;$('p2').value='+'+s.parent;go()}}catch(e){}})();
</script>
</body>
</html>
